<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>视频标注工作台</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', monospace; background: #1a1a1a; color: #e0e0e0; padding: 10px; }
button { cursor: pointer; padding: 4px 10px; border: 1px solid #555; background: #333; color: #e0e0e0; border-radius: 3px; font-size: 12px; }
button:hover { background: #444; }
button.primary { background: #2563eb; border-color: #2563eb; color: white; }
button.primary:hover { background: #1d4ed8; }
button.danger { background: #dc2626; border-color: #dc2626; color: white; }
input, select { padding: 4px 8px; border: 1px solid #555; background: #2a2a2a; color: #e0e0e0; border-radius: 3px; font-size: 12px; }
label { font-size: 11px; color: #aaa; display: block; margin-bottom: 2px; }
.row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.panel { background: #222; border: 1px solid #333; border-radius: 4px; padding: 10px; }
.quick-guide { margin-bottom: 10px; border-color: #36517c; background: #1e293b; font-size: 12px; line-height: 1.7; }
.quick-guide summary { cursor: pointer; color: #bfdbfe; font-weight: 600; }
.quick-guide ol { margin: 7px 0 0 22px; color: #d6e3f5; }
.quick-guide kbd { padding: 1px 5px; border: 1px solid #64748b; border-radius: 3px; background: #111827; }

#main { display: flex; gap: 10px; margin-bottom: 10px; }
#canvas-wrap { position: relative; flex: 1; background: #000; border-radius: 4px; overflow: hidden; line-height: 0; }
#canvas-wrap img { width: 100%; display: block; user-select: none; -webkit-user-drag: none; }
#canvas-wrap canvas { position: absolute; top: 0; left: 0; cursor: crosshair; }
#sidebar { width: 230px; display: flex; flex-direction: column; gap: 8px; }

#timeline { height: 80px; overflow-y: auto; }
.track-lane { display: flex; align-items: center; margin: 2px 0; height: 20px; }
.track-lane .label { width: 70px; font-size: 11px; overflow: hidden; cursor: pointer; white-space: nowrap; }
.track-lane .bar { flex: 1; height: 14px; background: #111; border-radius: 2px; position: relative; }
.track-lane .bar .filled { position: absolute; height: 100%; border-radius: 2px; opacity: 0.5; }
.track-lane .bar .gap { position: absolute; height: 4px; top: 5px; background: #ff4444; border-radius: 1px; }
.track-lane .bar .area-issue { position: absolute; height: 100%; top: 0; background: rgba(245, 158, 11, 0.78); border: 1px solid #fbbf24; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,0.35) inset; }
.track-lane .bar .playhead { position: absolute; width: 2px; height: 100%; background: #fff; opacity: 0.8; }
#info-bar { font-size: 11px; color: #aaa; margin-bottom: 6px; min-height: 16px; }
</style>
</head>
<body>

<details class="panel quick-guide" open>
  <summary>快速上手（点击可收起）</summary>
  <ol>
    <li>填写包含视频和标注文件的工作目录，点击“打开工作目录”。</li>
    <li>在右侧选择或新建轨迹，直接在画面上拖出目标框，再点击“保存当前框”。</li>
    <li><kbd>A</kbd>/<kbd>D</kbd> 前后逐帧，<kbd>S</kbd> 保存，<kbd>X</kbd> 删除，<kbd>C</kbd> 复制上一帧框；空格播放或暂停。</li>
    <li>可用 SAM3.1 从当前框继续跟踪；完成后导出 JSON，或导出含图片、YOLO TXT 和 VOC XML 的数据集。</li>
  </ol>
</details>

<!-- 工作目录栏 -->
<div class="row">
  <label style="display:inline">工作目录：</label>
  <input id="workspace-path" type="text" style="width:350px" placeholder="例如 D:\任务\0001">
  <button class="primary" onclick="openWorkspace()">打开工作目录</button>
  <button onclick="window.open('config', '_blank')">配置</button>
  <label style="display:inline; margin-left:10px">每</label>
  <input id="split-length" type="number" style="width:55px" value="300" min="1">
  <label style="display:inline">帧</label>
  <button onclick="splitWorkspace()">切分视频</button>
</div>
<div class="row">
  <button onclick="runPipeline()">运行本地轨迹处理</button>
  <button onclick="renderVideos()">生成轨迹视频</button>
  <button onclick="saveProject()">保存项目</button>
  <button onclick="loadProject()">重新载入</button>
  <button class="primary" onclick="exportResults()">导出标注 JSON</button>
  <button onclick="appendTrackingResults()">追加标注 JSON</button>
  <button class="primary" onclick="exportYolo()">导出 YOLO + VOC</button>
  <label style="display:inline">每</label>
  <input id="yolo-interval" type="number" style="width:40px" value="1" min="1">
  <label style="display:inline">帧</label>
  <span style="width:10px"></span>
  <button class="primary" onclick="exportMergedYolo()">合并导出所有分段</button>
</div>

<!-- Segment Selector -->
<div id="segment-bar" class="row" style="display:none; flex-wrap:wrap;">
  <label style="display:inline; margin-right:6px">视频分段：</label>
  <div id="segment-list" style="display:flex; gap:4px; flex-wrap:wrap;"></div>
  <button class="primary" onclick="runAllSegments()" style="margin-left:10px">处理全部分段</button>
</div>

<!-- Main Area -->
<div id="main">
  <div id="canvas-wrap">
    <img id="frame-img" src="" alt="">
    <canvas id="overlay"></canvas>
  </div>
  <div id="sidebar">
    <div class="panel">
      <label>目标轨迹</label>
      <div id="track-list" style="max-height:120px; overflow-y:auto;"></div>
      <div class="row" style="margin-top:6px">
        <button onclick="addTrack()">＋ 新建</button>
        <button class="danger" onclick="deleteTrack()">－ 删除</button>
        <button onclick="mergeTracks()">合并</button>
      </div>
      <div class="row" style="margin-top:4px">
        <label style="display:inline; margin:0">类别编号：</label>
        <input id="class-input" type="number" style="width:45px" value="0" min="0">
        <button onclick="setClassId()">设置</button>
      </div>
    </div>
    <div class="panel">
      <label>目标框显示方式</label>
      <div class="row">
        <button id="view-all-btn" class="primary" onclick="setViewMode('all')">全部轨迹</button>
        <button id="view-single-btn" onclick="setViewMode('single')">仅当前轨迹</button>
      </div>
    </div>
    <div class="panel">
      <label>当前轨迹的标注</label>
      <button class="primary" onclick="saveAnnotation()" style="width:100%; margin-bottom:4px">保存当前框（S）</button>
      <button onclick="deleteAnnotation()" style="width:100%; margin-bottom:4px">删除当前帧标注（X）</button>
      <button onclick="copyPrevAnnotation()" style="width:100%; margin-bottom:4px">复制上一帧框（C）</button>
      <button id="sam31-btn" class="primary" onclick="startSam31BoxTrack()" style="width:100%; margin-bottom:4px">用 SAM3.1 向后跟踪</button>
      <div class="row" style="margin-top:4px">
        <label style="display:inline; margin:0">最多帧数：</label>
        <input id="sam31-max-frames" type="number" style="width:64px" value="0" min="0">
        <label style="display:inline; margin:0">显卡：</label>
        <input id="sam31-cuda-device" type="number" style="width:44px" min="0" placeholder="#">
      </div>
      <div class="row" style="margin-top:4px">
        <button class="danger" onclick="deleteAllBefore()" style="flex:1">删除此前标注</button>
        <button class="danger" onclick="deleteAllAfter()" style="flex:1">删除此后标注</button>
      </div>
      <button onclick="splitTrackAfter()" style="width:100%; margin-bottom:4px" title="当前帧保留在原轨迹；之后的标注移动到继承相同类别的新轨迹">将此后标注分离成新轨迹</button>
    </div>
    <div class="panel">
      <label>区间插值与清理</label>
      <div class="row">
        <span style="font-size:11px">A:</span>
        <input id="interp-a" type="number" style="width:55px" value="0">
        <button onclick="markA()">设为当前帧（Q）</button>
      </div>
      <div class="row">
        <span style="font-size:11px">B:</span>
        <input id="interp-b" type="number" style="width:55px" value="0">
        <button onclick="markB()">设为当前帧（E）</button>
      </div>
      <button class="danger" onclick="deleteBetweenAB()" style="width:100%; margin-bottom:4px">删除 A 到 B 的标注</button>
      <button onclick="fixBboxSpikes()" style="width:100%; margin-bottom:4px">修复异常跳变框</button>
      <div class="row" style="margin-bottom:4px">
        <label style="display:inline; margin:0; font-size:11px">缺口小于：</label>
        <input id="bulk-interp-gap" type="number" style="width:55px" value="5" min="0">
        <button onclick="interpolateShortGaps()" style="flex:1">自动补齐缺口</button>
      </div>
      <button class="primary" onclick="doInterpolate()" style="width:100%">插值 A → B（R）</button>
    </div>
    <div id="status" style="font-size:11px; color:#888; padding:4px;"></div>
  </div>
</div>

<!-- Navigation -->
<div class="row">
  <button onclick="prevFrame()" title="上一帧（A 或左方向键）">◀ 上一帧</button>
  <input id="frame-slider" type="range" min="0" max="1" value="0" step="1" style="flex:1">
  <button onclick="nextFrame()" title="下一帧（D 或右方向键）">下一帧 ▶</button>
  <span id="frame-num" style="font-size:12px; width:90px; text-align:center">0/0</span>
  <button onclick="jumpPrevAnn()" title="跳到当前轨迹的上一处标注">上一标注</button>
  <button onclick="jumpNextAnn()" title="跳到当前轨迹的下一处标注">下一标注</button>
  <button onclick="jumpStart()" title="跳到当前轨迹起点">轨迹起点</button>
  <button onclick="jumpEnd()" title="跳到当前轨迹终点">轨迹终点</button>
  <span style="width:10px"></span>
  <button id="play-btn" class="primary" onclick="togglePlay()">▶ 播放</button>
  <select id="speed-select">
    <option value="0.25">0.25x</option>
    <option value="0.5">0.5x</option>
    <option value="1" selected>1x</option>
    <option value="2">2x</option>
    <option value="4">4x</option>
  </select>
</div>

<div id="info-bar"></div>
<div id="timeline" class="panel"></div>

<script>
// =========================================================================
const frameImg = document.getElementById('frame-img');
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');
const slider = document.getElementById('frame-slider');

let state = { fps: 30, width: 640, height: 480, frame_count: 0, tracks: [], workspace: null };
let activeTrackId = 1;
let viewMode = 'all';
let currentFrame = 0;
let isPlaying = false;
let playTimer = null;
let drawing = false, drawStart = null, drawEnd = null;
let currentBoxes = [];
const frameCache = new Map(); // frame_idx -> blob URL
const annotationCache = new Map(); // frame_idx -> annotations
let BUFFER_AHEAD = 30;
let BATCH_SIZE = 15;
let FRAME_CACHE_LIMIT = 80;
let ANNOTATION_BUFFER_AHEAD = 60;
let ANNOTATION_BATCH_SIZE = 60;
let ANNOTATION_CACHE_LIMIT = 300;
let videoVersion = 0;
let clientGeneration = 0;
let annotationGeneration = 0;
let batchFetching = false;
let batchFetchedUpTo = -1;
let annotationBatchFetching = false;
let annotationFetchedUpTo = -1;
let sam31JobTimer = null;
let overlayRaf = null;
let overlayWidth = 0;
let overlayHeight = 0;
const mediaAborters = new Set();
const MEDIA_FETCH_TIMEOUT_MS = 8000;
let playbackWaitTicks = 0;

// =========================================================================
// API
// =========================================================================
function appUrl(url) {
  return url.startsWith('/') ? `.${url}` : url;
}

async function api(method, url, body, extraOpts = {}) {
  const opts = { method, headers: { 'Content-Type': 'application/json' }, ...extraOpts };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const r = await fetch(appUrl(url), opts);
  if (!r.ok) {
    const err = await r.json().catch(() => ({ detail: r.statusText }));
    throw new Error(err.detail || 'API error');
  }
  return r.json();
}

function createMediaController(timeoutMs = 0) {
  const controller = new AbortController();
  if (timeoutMs > 0) {
    controller.timeoutId = setTimeout(() => controller.abort(), timeoutMs);
  }
  mediaAborters.add(controller);
  return controller;
}

function releaseMediaController(controller) {
  if (controller.timeoutId) clearTimeout(controller.timeoutId);
  mediaAborters.delete(controller);
}

function resetMediaState({ clearImage = true } = {}) {
  clientGeneration++;
  stopPlay();
  for (const controller of mediaAborters) controller.abort();
  mediaAborters.clear();
  frameCache.forEach(url => URL.revokeObjectURL(url));
  frameCache.clear();
  clearAnnotationCache();
  batchFetching = false;
  batchFetchedUpTo = -1;
  annotationBatchFetching = false;
  annotationFetchedUpTo = -1;
  playbackWaitTicks = 0;
  currentBoxes = [];
  if (clearImage) frameImg.removeAttribute('src');
  renderOverlay();
}

// =========================================================================
// Frame loading — batch fetch for sequential access
// =========================================================================
function frameUrl(idx) { return appUrl(`/api/frame-image/${idx}?v=${videoVersion}`); }

async function fetchBatch(startIdx) {
  if (batchFetching) return;
  if (startIdx >= state.frame_count) return;
  const requestGeneration = clientGeneration;
  const requestVersion = videoVersion;
  const count = Math.min(BATCH_SIZE, state.frame_count - startIdx);
  const controller = createMediaController(MEDIA_FETCH_TIMEOUT_MS);
  batchFetching = true;
  try {
    const resp = await fetch(appUrl(`/api/frame-batch/${startIdx}/${count}?v=${requestVersion}`), {
      signal: controller.signal,
    });
    if (!resp.ok) return;
    const buffer = await resp.arrayBuffer();
    if (requestGeneration !== clientGeneration || requestVersion !== videoVersion) return;
    const view = new DataView(buffer);
    let offset = 0;
    let idx = startIdx;
    while (offset < buffer.byteLength) {
      const len = view.getUint32(offset); offset += 4;
      const jpeg = buffer.slice(offset, offset + len); offset += len;
      const blob = new Blob([jpeg], { type: 'image/jpeg' });
      const url = URL.createObjectURL(blob);
      // Revoke old blob URL if replacing
      if (frameCache.has(idx)) URL.revokeObjectURL(frameCache.get(idx));
      frameCache.set(idx, url);
      idx++;
    }
    batchFetchedUpTo = Math.max(batchFetchedUpTo, idx - 1);
  } catch (e) {
    if (e.name !== 'AbortError') console.warn(e);
  } finally {
    releaseMediaController(controller);
    if (requestGeneration === clientGeneration) batchFetching = false;
  }
}

function firstMissingFrame(fromIdx, lookAhead) {
  const end = Math.min(state.frame_count - 1, fromIdx + lookAhead);
  for (let idx = Math.max(0, fromIdx); idx <= end; idx++) {
    if (!frameCache.has(idx)) return idx;
  }
  return null;
}

function ensureBuffer(fromIdx) {
  const missing = firstMissingFrame(fromIdx, Math.max(BUFFER_AHEAD, BATCH_SIZE));
  if (missing !== null && !batchFetching) {
    fetchBatch(missing);
  } else {
    const buffered = batchFetchedUpTo - fromIdx;
    if (buffered < BUFFER_AHEAD / 2 && !batchFetching) {
      fetchBatch(Math.max(fromIdx, batchFetchedUpTo + 1));
    }
  }
  // Evict old frames to cap memory
  if (frameCache.size > FRAME_CACHE_LIMIT) {
    const keepBehind = Math.max(5, Math.floor(BUFFER_AHEAD / 3));
    const keepAhead = Math.max(BUFFER_AHEAD, BATCH_SIZE);
    for (const [k, url] of frameCache) {
      if (k < fromIdx - keepBehind || k > fromIdx + keepAhead) {
        URL.revokeObjectURL(url);
        frameCache.delete(k);
      }
    }
  }
}

async function fetchAnnotationBatch(startIdx) {
  if (annotationBatchFetching) return;
  if (startIdx >= state.frame_count) return;
  const count = Math.min(ANNOTATION_BATCH_SIZE, state.frame_count - startIdx);
  const requestGeneration = clientGeneration;
  const requestAnnotationGeneration = annotationGeneration;
  const requestVersion = videoVersion;
  const controller = createMediaController(MEDIA_FETCH_TIMEOUT_MS);
  annotationBatchFetching = true;
  try {
    const data = await api('GET', `/api/annotations-batch/${startIdx}/${count}?v=${requestVersion}`, undefined, {
      signal: controller.signal,
    });
    if (
      requestGeneration === clientGeneration &&
      requestAnnotationGeneration === annotationGeneration &&
      requestVersion === videoVersion
    ) {
      for (const frame of data.frames || []) {
        annotationCache.set(frame.frame_idx, frame.annotations || []);
        annotationFetchedUpTo = Math.max(annotationFetchedUpTo, frame.frame_idx);
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError') console.warn(e);
  } finally {
    releaseMediaController(controller);
    if (requestGeneration === clientGeneration) annotationBatchFetching = false;
  }
}

function firstMissingAnnotationFrame(fromIdx, lookAhead) {
  const end = Math.min(state.frame_count - 1, fromIdx + lookAhead);
  for (let idx = Math.max(0, fromIdx); idx <= end; idx++) {
    if (!annotationCache.has(idx)) return idx;
  }
  return null;
}

function ensureAnnotationBuffer(fromIdx) {
  const missing = firstMissingAnnotationFrame(fromIdx, Math.max(ANNOTATION_BUFFER_AHEAD, ANNOTATION_BATCH_SIZE));
  if (missing !== null && !annotationBatchFetching) {
    fetchAnnotationBatch(missing);
  } else {
    const buffered = annotationFetchedUpTo - fromIdx;
    if (buffered < ANNOTATION_BUFFER_AHEAD / 2 && !annotationBatchFetching) {
      fetchAnnotationBatch(Math.max(fromIdx, annotationFetchedUpTo + 1));
    }
  }
  if (annotationCache.size > ANNOTATION_CACHE_LIMIT) {
    const keepBehind = Math.max(5, Math.floor(ANNOTATION_BUFFER_AHEAD / 3));
    const keepAhead = Math.max(ANNOTATION_BUFFER_AHEAD, ANNOTATION_BATCH_SIZE);
    for (const k of annotationCache.keys()) {
      if (k < fromIdx - keepBehind || k > fromIdx + keepAhead) {
        annotationCache.delete(k);
      }
    }
  }
}

function clearAnnotationCache() {
  annotationGeneration++;
  annotationCache.clear();
  annotationFetchedUpTo = -1;
}

function showFrame(idx) {
  const cached = frameCache.get(idx);
  if (cached) {
    frameImg.src = cached;
  } else {
    frameImg.src = frameUrl(idx);
  }
  ensureBuffer(idx);
}

// =========================================================================
// Core
// =========================================================================
function seekToFrame(idx) {
  playbackWaitTicks = 0;
  idx = Math.max(0, Math.min(state.frame_count - 1, idx));
  currentFrame = idx;
  slider.value = idx;
  document.getElementById('frame-num').textContent = `${idx}/${state.frame_count - 1}`;
  showFrame(idx);
  fetchAnnotations(idx);
  updateInfo();
  renderTimeline();
}

async function fetchAnnotations(frameIdx) {
  if (annotationCache.has(frameIdx)) {
    currentBoxes = annotationCache.get(frameIdx);
    renderOverlay();
    ensureAnnotationBuffer(frameIdx);
    return;
  }
  ensureAnnotationBuffer(frameIdx);
  if (isPlaying) return;
  currentBoxes = [];
  renderOverlay();
  const requestGeneration = clientGeneration;
  const requestAnnotationGeneration = annotationGeneration;
  const requestVersion = videoVersion;
  const controller = createMediaController(MEDIA_FETCH_TIMEOUT_MS);
  try {
    const data = await api('GET', `/api/frame/${frameIdx}?v=${requestVersion}`, undefined, {
      signal: controller.signal,
    });
    if (
      requestGeneration !== clientGeneration ||
      requestAnnotationGeneration !== annotationGeneration ||
      requestVersion !== videoVersion
    ) return;
    annotationCache.set(frameIdx, data.annotations || []);
    if (frameIdx === currentFrame) {
      currentBoxes = data.annotations || [];
      renderOverlay();
    }
  } catch (e) {
    if (e.name !== 'AbortError') console.warn(e);
  } finally {
    releaseMediaController(controller);
  }
}

// =========================================================================
// Playback — adaptive, only advances when frame is ready
// =========================================================================
function togglePlay() { isPlaying ? stopPlay() : startPlay(); }
function startPlay() {
  isPlaying = true;
  playbackWaitTicks = 0;
  document.getElementById('play-btn').textContent = '⏸ 暂停';
  const speed = parseFloat(document.getElementById('speed-select').value);
  const interval = 1000.0 / (state.fps * speed);
  const playGeneration = clientGeneration;
  // Pre-fetch a batch ahead before starting
  ensureBuffer(currentFrame + 1);
  ensureAnnotationBuffer(currentFrame + 1);
  Promise.all([fetchBatch(currentFrame + 1), fetchAnnotationBatch(currentFrame + 1)]).then(() => {
    if (!isPlaying || playGeneration !== clientGeneration) return;
    if (playTimer) clearInterval(playTimer);
    playTimer = setInterval(playTick, interval);
  });
}
function playTick() {
  if (currentFrame >= state.frame_count - 1) { stopPlay(); return; }
  const nextFrame = currentFrame + 1;
  // Adaptive: skip frame display if not buffered (don't stutter, just wait)
  if (!frameCache.has(nextFrame) || !annotationCache.has(nextFrame)) {
    playbackWaitTicks++;
    ensureBuffer(nextFrame);
    ensureAnnotationBuffer(nextFrame);
    if (playbackWaitTicks === 10) {
      setStatus(`正在缓冲第 ${nextFrame} 帧…`);
    }
    return; // skip this tick, try next interval
  }
  playbackWaitTicks = 0;
  currentFrame = nextFrame;
  slider.value = currentFrame;
  document.getElementById('frame-num').textContent = `${currentFrame}/${state.frame_count - 1}`;
  showFrame(currentFrame);
  fetchAnnotations(currentFrame);
  ensureBuffer(currentFrame);
  ensureAnnotationBuffer(currentFrame);
}
function stopPlay() {
  isPlaying = false;
  playbackWaitTicks = 0;
  document.getElementById('play-btn').textContent = '▶ 播放';
  if (playTimer) { clearInterval(playTimer); playTimer = null; }
  updateInfo(); renderTimeline();
}

// =========================================================================
// Navigation
// =========================================================================
function prevFrame() { if (isPlaying) stopPlay(); seekToFrame(currentFrame - 1); }
function nextFrame() { if (isPlaying) stopPlay(); seekToFrame(currentFrame + 1); }
function jumpPrevAnn() {
  const t = state.tracks.find(t => t.track_id === activeTrackId);
  if (!t) return;
  const prev = t.annotated_indices.filter(i => i < currentFrame);
  if (prev.length) seekToFrame(prev[prev.length - 1]);
}
function jumpNextAnn() {
  const t = state.tracks.find(t => t.track_id === activeTrackId);
  if (!t) return;
  const next = t.annotated_indices.filter(i => i > currentFrame);
  if (next.length) seekToFrame(next[0]);
}
function jumpStart() {
  const t = state.tracks.find(t => t.track_id === activeTrackId);
  if (t && t.start_frame != null) seekToFrame(t.start_frame);
}
function jumpEnd() {
  const t = state.tracks.find(t => t.track_id === activeTrackId);
  if (t && t.end_frame != null) seekToFrame(t.end_frame);
}
slider.addEventListener('input', () => { if (isPlaying) stopPlay(); seekToFrame(parseInt(slider.value)); });

// =========================================================================
// Canvas overlay
// =========================================================================
function resizeCanvas() {
  const rect = frameImg.getBoundingClientRect();
  overlayWidth = rect.width;
  overlayHeight = rect.height;
  const pixelRatio = window.devicePixelRatio || 1;
  canvas.style.width = `${overlayWidth}px`;
  canvas.style.height = `${overlayHeight}px`;
  canvas.width = Math.max(1, Math.round(overlayWidth * pixelRatio));
  canvas.height = Math.max(1, Math.round(overlayHeight * pixelRatio));
  ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
  renderOverlay();
}

function pointerOnCanvas(event) {
  const rect = canvas.getBoundingClientRect();
  const width = overlayWidth || rect.width;
  const height = overlayHeight || rect.height;
  const x = rect.width ? (event.clientX - rect.left) * width / rect.width : 0;
  const y = rect.height ? (event.clientY - rect.top) * height / rect.height : 0;
  return {
    x: Math.max(0, Math.min(width, x)),
    y: Math.max(0, Math.min(height, y)),
  };
}
function renderOverlay() {
  if (overlayRaf !== null) return;
  overlayRaf = requestAnimationFrame(() => {
    overlayRaf = null;
    paintOverlay();
  });
}
function paintOverlay() {
  if (!overlayWidth || !overlayHeight || !state.width || !state.height) return;
  ctx.clearRect(0, 0, overlayWidth, overlayHeight);
  const scaleX = overlayWidth / state.width, scaleY = overlayHeight / state.height;
  const boxes = viewMode === 'all' ? currentBoxes : currentBoxes.filter(b => b.track_id === activeTrackId);
  for (const box of boxes) {
    const [x1, y1, x2, y2] = box.bbox;
    const sx = x1*scaleX, sy = y1*scaleY, sw = (x2-x1)*scaleX, sh = (y2-y1)*scaleY;
    const color = trackColor(box.track_id);
    ctx.strokeStyle = color;
    ctx.lineWidth = box.track_id === activeTrackId ? 2.5 : 1.5;
    ctx.strokeRect(sx, sy, sw, sh);
    const lbl = `ID ${box.track_id}`;
    ctx.font = '11px monospace';
    const tw = ctx.measureText(lbl).width;
    ctx.fillStyle = color; ctx.fillRect(sx, sy-14, tw+6, 14);
    ctx.fillStyle = '#000'; ctx.fillText(lbl, sx+3, sy-3);
  }
  if (drawing && drawStart && drawEnd) {
    const sx = Math.min(drawStart.x, drawEnd.x), sy = Math.min(drawStart.y, drawEnd.y);
    const sw = Math.abs(drawEnd.x-drawStart.x), sh = Math.abs(drawEnd.y-drawStart.y);
    ctx.strokeStyle = '#00ff00'; ctx.lineWidth = 2; ctx.setLineDash([5,3]);
    ctx.strokeRect(sx, sy, sw, sh); ctx.setLineDash([]);
  }
}
function trackColor(id) { return `rgb(${(37*id+80)%256},${(97*id+140)%256},${(17*id+220)%256})`; }

// =========================================================================
// Drawing
// =========================================================================
canvas.addEventListener('mousedown', e => {
  if (isPlaying) return;
  drawStart = pointerOnCanvas(e); drawEnd = {...drawStart}; drawing = true;
});
canvas.addEventListener('mousemove', e => {
  if (!drawing) return;
  drawEnd = pointerOnCanvas(e); renderOverlay();
});
canvas.addEventListener('mouseup', e => {
  if (!drawing) return; drawing = false;
  drawEnd = pointerOnCanvas(e);
  const scaleX = state.width/overlayWidth, scaleY = state.height/overlayHeight;
  const x1 = Math.min(drawStart.x,drawEnd.x)*scaleX, y1 = Math.min(drawStart.y,drawEnd.y)*scaleY;
  const x2 = Math.max(drawStart.x,drawEnd.x)*scaleX, y2 = Math.max(drawStart.y,drawEnd.y)*scaleY;
  if (Math.abs(x2-x1) < 5 || Math.abs(y2-y1) < 5) { drawStart=null; drawEnd=null; renderOverlay(); return; }
  const bbox = [x1,y1,x2,y2];
  const idx = currentBoxes.findIndex(b => b.track_id === activeTrackId);
  if (idx >= 0) currentBoxes[idx].bbox = bbox; else currentBoxes.push({ track_id: activeTrackId, bbox });
  drawStart=null; drawEnd=null; renderOverlay();
});

async function startSam31BoxTrack() {
  const box = currentBoxes.find(b => b.track_id === activeTrackId);
  if (!box) { setStatus('请先为当前轨迹绘制或载入一个目标框'); return; }
  const maxFrames = parseInt(document.getElementById('sam31-max-frames').value) || 0;

  if (cudaRaw !== '' && (!Number.isInteger(cudaDevice) || cudaDevice < 0)) {
    setStatus('显卡编号必须是大于或等于 0 的整数');
    return;
  }
  const btn = document.getElementById('sam31-btn');
  if (!confirm(`从第 ${currentFrame} 帧开始，用 SAM3.1 跟踪轨迹 ${activeTrackId}？该轨迹从当前帧起的原标注会被跟踪结果替换。`)) return;
  try {
    btn.disabled = true;
    setStatus('正在启动 SAM3.1 跟踪任务…');
    const r = await api('POST', '/api/sam31/box-track', {
      track_id: activeTrackId,
      frame_idx: currentFrame,
      bbox: box.bbox,
      max_frames: maxFrames,
      replace_after: true,
      cuda_device: cudaDevice,
    });
    pollSam31Job(r.job_id);
  } catch (e) {
    btn.disabled = false;
    setStatus('Error: '+e.message);
  }
}

function pollSam31Job(jobId) {
  if (sam31JobTimer) clearInterval(sam31JobTimer);
  sam31JobTimer = setInterval(async () => {
    try {
      const job = await api('GET', `/api/sam31/job/${jobId}`);
      setStatus(`SAM3.1 状态：${job.status} ${job.message || ''}`);
      if (job.status === 'done') {
        clearInterval(sam31JobTimer); sam31JobTimer = null;
        document.getElementById('sam31-btn').disabled = false;
        clearAnnotationCache();
        await refreshState(); fetchAnnotations(currentFrame);
        setStatus(job.message || 'SAM3.1 跟踪完成');
      } else if (job.status === 'failed') {
        clearInterval(sam31JobTimer); sam31JobTimer = null;
        document.getElementById('sam31-btn').disabled = false;
        const detail = job.stderr ? ` | ${job.stderr.slice(-300)}` : '';
        setStatus(`SAM3.1 跟踪失败：${job.message}${detail}`);
      }
    } catch (e) {
      clearInterval(sam31JobTimer); sam31JobTimer = null;
      document.getElementById('sam31-btn').disabled = false;
      setStatus('Error: '+e.message);
    }
  }, 2000);
}

async function refreshState() {

  if (state.version != null) videoVersion = state.version;

function applyAnnotatorConfig(cfg) {
  BUFFER_AHEAD = Math.max(1, parseInt(cfg.frame_buffer_ahead) || BUFFER_AHEAD);
  BATCH_SIZE = Math.max(1, parseInt(cfg.frame_batch_size) || BATCH_SIZE);
  FRAME_CACHE_LIMIT = Math.max(BUFFER_AHEAD + BATCH_SIZE, parseInt(cfg.frame_cache_limit) || FRAME_CACHE_LIMIT);
  ANNOTATION_BUFFER_AHEAD = Math.max(1, parseInt(cfg.annotation_buffer_ahead) || ANNOTATION_BUFFER_AHEAD);
  ANNOTATION_BATCH_SIZE = Math.max(1, parseInt(cfg.annotation_batch_size) || ANNOTATION_BATCH_SIZE);
  ANNOTATION_CACHE_LIMIT = Math.max(
    ANNOTATION_BUFFER_AHEAD + ANNOTATION_BATCH_SIZE,
    parseInt(cfg.annotation_cache_limit) || ANNOTATION_CACHE_LIMIT
  );
}

function renderTimeline() {
  const el = document.getElementById('timeline');
  if (!state.frame_count) { el.innerHTML = ''; return; }
  const maxF = Math.max(1, state.frame_count - 1);
  let html = '';
  for (const t of state.tracks) {
    const color = trackColor(t.track_id);
    const marker = t.track_id === activeTrackId ? ' ◄' : '';
    let bar = '';
    if (t.start_frame != null) {
      const l = (t.start_frame/maxF*100).toFixed(1), w = Math.max(0.5,(t.end_frame-t.start_frame)/maxF*100).toFixed(1);
      bar += `<div class="filled" style="left:${l}%;width:${w}%;background:${color}"></div>`;
      const idx = t.annotated_indices;
      for (let i=1; i<idx.length; i++) {
        if (idx[i]-idx[i-1] > 1) {
          const gl=(idx[i-1]/maxF*100).toFixed(1), gw=((idx[i]-idx[i-1])/maxF*100).toFixed(1);
          bar += `<div class="gap" style="left:${gl}%;width:${gw}%"></div>`;
        }
      }
      for (const seg of (t.area_anomaly_segments || [])) {
        const start = Math.max(0, Math.min(maxF, parseInt(seg.start)));
        const end = Math.max(start, Math.min(maxF, parseInt(seg.end)));
        const l = (start/maxF*100).toFixed(1);
        const w = Math.max(0.5, ((end - start + 1)/maxF*100)).toFixed(1);
        const reasons = (seg.reasons || []).join('+') || 'area';
        const ratio = Number(seg.max_area_ratio || 0).toFixed(2);
        const jumpRatio = Number(seg.max_frame_change_ratio || 1).toFixed(2);
        const jumpAbs = Number(seg.max_frame_change_abs || 0).toFixed(0);
        bar += `<div class="area-issue" title="Area issue ${start}-${end} ${reasons} maxRatio=${ratio} jumpRatio=${jumpRatio} jumpAbs=${jumpAbs}" style="left:${l}%;width:${w}%"></div>`;
      }
    }
    bar += `<div class="playhead" style="left:${(currentFrame/maxF*100).toFixed(1)}%"></div>`;
    html += `<div class="track-lane"><div class="label" style="color:${color}" onclick="setActiveTrack(${t.track_id})">T${t.track_id}${marker}</div><div class="bar">${bar}</div></div>`;
  }
  el.innerHTML = html;
}
function updateInfo() {
  const t = state.tracks.find(t => t.track_id === activeTrackId);
  const has = t ? t.annotated_indices.includes(currentFrame) : false;
  const ti = t && t.start_frame != null ? `轨迹 ${activeTrackId}：${t.start_frame} → ${t.end_frame}（${t.num_frames} 帧）` : `轨迹 ${activeTrackId}：暂无标注`;
  document.getElementById('info-bar').textContent = `当前帧 ${currentFrame}/${state.frame_count-1} [${has?'已有标注':'未标注'}] | ${ti}`;
}
function setStatus(msg) {
  const text = String(msg || '').replace(/^Error:\s*/, '错误：');
  document.getElementById('status').textContent = text;
}

// =========================================================================
// Keyboard
// =========================================================================
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  switch(e.key) {
    case 'ArrowLeft': case 'a': prevFrame(); e.preventDefault(); break;
    case 'ArrowRight': case 'd': nextFrame(); e.preventDefault(); break;
    case ' ': togglePlay(); e.preventDefault(); break;
    case 's': saveAnnotation(); e.preventDefault(); break;
    case 'x': deleteAnnotation(); e.preventDefault(); break;
    case 'c': copyPrevAnnotation(); e.preventDefault(); break;
    case 'q': markA(); e.preventDefault(); break;
    case 'e': markB(); e.preventDefault(); break;
    case 'r': doInterpolate(); e.preventDefault(); break;
  }
});

// =========================================================================
// Init
// =========================================================================
const resizeObs = new ResizeObserver(() => resizeCanvas());
resizeObs.observe(frameImg);
frameImg.addEventListener('load', resizeCanvas);
window.addEventListener('resize', resizeCanvas);
</script>
</body>
