<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户管理</title><style>body{margin:0;background:#f4f7fb;color:#172033;font:14px/1.55 Arial,"Microsoft YaHei",sans-serif}main{max-width:1100px;margin:30px auto;padding:0 20px}.panel{background:#fff;border:1px solid #e3e8f1;border-radius:12px;padding:22px;box-shadow:0 8px 28px #1e2d5014;margin-bottom:18px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.field{display:flex;flex-direction:column;gap:5px;min-width:160px}.field input{padding:9px;border:1px solid #d8deea;border-radius:7px}.button{border:1px solid #d8deea;border-radius:7px;background:#fff;padding:9px 12px;cursor:pointer}.primary{background:#4f46e5;color:white;border-color:#4f46e5}.danger{color:#c43d4b}.error{color:#c43d4b;margin-top:10px}table{border-collapse:collapse;width:100%}th,td{text-align:left;border-bottom:1px solid #e8ecf2;padding:10px}h1{margin-top:0}
textarea,select{font:inherit;padding:9px;border:1px solid #d8deea;border-radius:7px}button,input{font:inherit}.back{display:inline-block;text-decoration:none;font-size:16px;padding:14px 22px;margin-bottom:16px}.table-wrap{overflow:auto}td input,td select{max-width:150px;padding:7px;border:1px solid #d8deea;border-radius:6px}.recipient-options{display:flex;gap:14px;flex-wrap:wrap;padding:12px 0}.field textarea{width:100%;min-height:110px}dialog{border:0;border-radius:10px;max-width:90vw}.status{color:#16865b}
</style></head>
<body><main><a class="button primary back" href="/">← 返回主页面</a><a class="button back" href="/reminders">自动提醒管理</a><h1>用户管理</h1>
<div id="error" class="error" role="alert"></div><div id="status" class="status" role="status"></div>
<section class="panel"><h2>创建用户</h2><form id="create-form" class="row"><label class="field">用户名<input name="username" required></label><label class="field">显示名<input name="display_name"></label><label class="field">手机号<input name="phone" type="tel"></label><label class="field">初始密码<input name="password" type="password" minlength="8" required></label><label class="field">角色<select name="role"><option value="user">普通用户</option><option value="admin">管理员</option></select></label><button class="button primary">创建用户</button></form></section>
<section class="panel"><h2>用户列表</h2><p>编辑信息后点击保存。启用的用户填写手机号后，即可在下方选择为通知对象。</p><div id="users" class="table-wrap"></div></section>
<section class="panel"><h2>钉钉机器人</h2><form id="robot-form" class="row"><label class="field">名称<input name="name" required></label><label class="field" style="flex:1">Webhook<input name="webhook_url" type="url" required></label><label class="field">加签 Secret<input name="secret" type="password" required></label><button class="button primary">添加机器人</button></form><div id="robots" class="table-wrap"></div></section>
<section class="panel"><h2>手动测试通知</h2><form id="notification-form"><label class="field">机器人<select id="test-robot" required></select></label><label class="field" style="margin-top:14px">通知内容<textarea id="test-content" required placeholder="输入要发送的通知内容"></textarea></label><fieldset><legend>选择要 @ 的用户（可多选）</legend><div id="recipient-options" class="recipient-options"></div></fieldset><button class="button primary" id="send-button">发送通知</button></form></section>
</main><script src="/static/users.js"></script></body></html>
