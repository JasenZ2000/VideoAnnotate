<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>任务总览 - 多人标注协作平台</title><style>:root{--bg:#f4f7fb;--panel:#fff;--ink:#172033;--muted:#6d778b;--line:#e3e8f1;--brand:#4f46e5;--ok:#16865b;--warn:#c27412}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,"Microsoft YaHei",system-ui,sans-serif}header{height:68px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}.brand{font-weight:800;font-size:18px}.userbar{display:flex;align-items:center;gap:10px}.ghost,.primary{border-radius:9px;padding:8px 12px;font:inherit;cursor:pointer}.ghost{background:#fff;border:1px solid var(--line)}.primary{background:var(--brand);border:0;color:#fff}.hidden{display:none!important}.shell{max-width:1600px;margin:auto;padding:26px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 14px 40px rgba(30,45,80,.09)}h1{margin:0 0 6px}.sub{color:var(--muted);font-size:12px}.tools{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:20px 0}.field{display:grid;gap:4px}.field input,.field select{border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:1450px}th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}th{background:#fafbfe;color:var(--muted);font-weight:700;position:sticky;top:0}.state{font-weight:700}.state.completed{color:var(--ok)}.state.in_progress,.state.submitted{color:var(--warn)}.notice{padding:12px;border-radius:10px;background:#f7f8ff;color:var(--muted);margin:12px 0}.error{color:#c43d4b}.pager{display:flex;justify-content:space-between;align-items:center;margin-top:14px}</style></head><body><header><div class="brand">标 多人标注协作平台 · 任务总览</div><div class="userbar"><button class="ghost" onclick="location.href='/'">返回平台</button><button id="attendance-btn" class="ghost hidden" onclick="checkIn()">标注员报到</button><span id="attendance-count" class="sub"></span><span id="user-name">加载中</span></div></header><main class="shell"><section class="panel"><h1>任务总览</h1><div id="attendance-notice" class="notice">正在加载今日报到情况…</div><div class="tools"><div class="field"><label>状态</label><select id="status"><option value="">全部状态</option><option value="awaiting_parts">待补充 Part</option><option value="pending">待领取</option><option value="in_progress">执行中</option><option value="submitted">待审核</option><option value="completed">已完成</option><option value="mixed">混合状态</option></select></div><div class="field"><label>关键词</label><input id="query" placeholder="项目、申请人、任务内容"></div><div class="field"><label>产品标签</label><select id="tag"><option value="">全部</option></select></div><button class="primary" onclick="load()">刷新</button></div><div id="error" class="error"></div><div class="table-wrap"><table><thead><tr><th>状态</th><th>优先级</th><th>排序</th><th>项目</th><th>标注内容</th><th>申请日期</th><th>申请人</th><th>发布者</th><th>Part 总数</th><th>待领取</th><th>执行中</th><th>待审核</th><th>退修</th><th>已完成</th><th>通过率</th><th>预计工时</th><th>预计第几天完成</th><th>预计完成日期</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager"><span id="summary"></span><span><button class="ghost" id="prev" onclick="move(-1)">上一页</button> <button class="ghost" id="next" onclick="move(1)">下一页</button></span></div></section></main><script src="/static/overview.js"></script></body></html>
