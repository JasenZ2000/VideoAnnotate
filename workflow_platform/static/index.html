<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>多人标注协作平台</title>
  <style>
    :root{--bg:#f4f7fb;--panel:#fff;--ink:#172033;--muted:#6d778b;--line:#e3e8f1;--brand:#4f46e5;--brand2:#7c3aed;--ok:#16865b;--warn:#c27412;--bad:#c43d4b;--shadow:0 14px 40px rgba(30,45,80,.09)}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% -10%,#e5e9ff 0,transparent 30%),var(--bg);color:var(--ink);font:14px/1.55 Inter,"Microsoft YaHei",system-ui,sans-serif}
    button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    header{height:68px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.86);backdrop-filter:blur(16px);border-bottom:1px solid rgba(220,226,238,.8);position:sticky;top:0;z-index:20}
    .brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:18px}.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;box-shadow:0 8px 20px rgba(79,70,229,.28)}
    .userbar{display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#eef0ff;color:var(--brand);font-weight:800}
    .shell{max-width:1480px;margin:auto;padding:26px;display:grid;grid-template-columns:340px minmax(0,1fr);gap:22px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
    .sidebar{min-height:calc(100vh - 120px);overflow:hidden}.side-head{padding:20px;border-bottom:1px solid var(--line)}.side-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.side-title h2{margin:0;font-size:17px}
    .primary{border:0;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:10px;padding:9px 14px;font-weight:700}.primary:hover{filter:brightness(1.05)}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 12px}.danger{color:var(--bad)}
    .search{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#f8f9fc;outline:0}.search:focus,input:focus,textarea:focus,select:focus{border-color:#a5a1fb;box-shadow:0 0 0 3px #eeedff}
    .filters{display:flex;gap:6px;overflow:auto;margin-top:10px}.chip{white-space:nowrap;border:0;border-radius:999px;padding:6px 10px;background:#f0f2f7;color:var(--muted)}.chip.active{background:#e7e7ff;color:var(--brand);font-weight:700}
    .task-list{padding:10px;max-height:calc(100vh - 250px);overflow:auto}.task-card{padding:15px;border:1px solid transparent;border-radius:13px;margin-bottom:6px;cursor:pointer;transition:.15s}.task-card:hover{background:#f7f8fc}.task-card.active{background:#f0efff;border-color:#d6d3ff}.task-top{display:flex;justify-content:space-between;gap:8px}.tag{display:inline-flex;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:800;background:#ecebff;color:var(--brand)}.task-name{font-weight:750;margin:7px 0 4px}.sub{color:var(--muted);font-size:12px}.progress{height:6px;border-radius:9px;background:#e9edf4;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#34b899)}
    .content{min-width:0}.empty{min-height:520px;display:grid;place-items:center;text-align:center;color:var(--muted);padding:40px}.empty .big{font-size:48px;margin-bottom:10px}
    .detail{padding:26px}.hero{display:flex;justify-content:space-between;gap:22px;align-items:flex-start;padding-bottom:20px;border-bottom:1px solid var(--line)}.hero h1{font-size:25px;line-height:1.3;margin:8px 0}.hero-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.meta-line{display:flex;gap:15px;flex-wrap:wrap;color:var(--muted)}
    .summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0}.metric{padding:14px;border:1px solid var(--line);border-radius:13px;background:#fafbfe}.metric b{display:block;font-size:23px}.metric span{color:var(--muted);font-size:12px}
    section{margin-top:22px}section h2{font-size:16px;margin:0 0 12px}.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.info{padding:12px 14px;border:1px solid var(--line);border-radius:12px;min-width:0}.info label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.info .value{white-space:pre-wrap;word-break:break-all}.wide{grid-column:span 3}.copy{float:right;border:0;background:transparent;color:var(--brand);padding:0}
    .part-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:12px}.part{border:1px solid var(--line);border-radius:14px;padding:15px}.part-head{display:flex;align-items:center;justify-content:space-between}.status{font-size:12px;border-radius:999px;padding:3px 8px;background:#eef1f6;color:#586278}.status.in_progress{background:#e7f0ff;color:#2468b5}.status.submitted{background:#fff2d9;color:#a36306}.status.rework{background:#ffe7e9;color:var(--bad)}.status.completed{background:#e2f6ed;color:var(--ok)}.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;margin:10px 0}.note{color:var(--muted);font-size:12px;white-space:pre-wrap}.comments{border-top:1px dashed var(--line);margin-top:10px;padding-top:8px}.comment{font-size:12px;margin:5px 0}.part-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.compact{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 9px}.approve{border-color:#a9dfc8;color:var(--ok)}.rework{border-color:#f0b8bd;color:var(--bad)}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--muted);background:#fafbfc;position:sticky;top:0}tr:last-child td{border-bottom:0}
    dialog{border:0;border-radius:18px;padding:0;box-shadow:0 30px 90px rgba(20,27,48,.25);width:min(760px,calc(100vw - 30px));color:var(--ink)}dialog::backdrop{background:rgba(19,27,44,.5);backdrop-filter:blur(3px)}.dialog-head,.dialog-foot{padding:17px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.dialog-foot{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end;gap:8px}.dialog-head h2{margin:0}.dialog-body{padding:20px;max-height:70vh;overflow:auto}.close{border:0;background:transparent;font-size:24px;color:var(--muted)}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;outline:0}.field textarea{min-height:150px;resize:vertical}.span2{grid-column:span 2}.hint{background:#f5f5ff;color:#514ca3;border-radius:10px;padding:10px 12px;margin-bottom:13px}.error{color:var(--bad);margin-top:8px}.review-queue{border-left:3px solid var(--warn)}
    @media(max-width:950px){.shell{grid-template-columns:1fr;padding:14px}.sidebar{min-height:0}.task-list{max-height:330px}.summary{grid-template-columns:repeat(2,1fr)}.info-grid{grid-template-columns:1fr}.wide{grid-column:auto}.hero{display:block}.hero-actions{justify-content:flex-start;margin-top:14px}}
  </style>
</head>
<body>
<header><div class="brand"><div class="logo">标</div><div>多人标注协作平台</div></div><div class="userbar"><button id="users-btn" class="ghost hidden" onclick="openUsers()">用户管理</button><div id="avatar" class="avatar">?</div><span id="user-name">未登录</span><button id="auth-btn" class="ghost" onclick="authAction()">登录</button></div></header>
<main class="shell">
  <aside class="panel sidebar"><div class="side-head"><div class="side-title"><h2>标注任务</h2><button class="primary" onclick="openPublish()">＋ 发布</button></div><input id="search" class="search" placeholder="搜索项目、内容或申请人" oninput="renderTasks()"><div id="filters" class="filters"></div></div><div id="task-list" class="task-list"></div></aside>
  <div id="content" class="panel content"><div class="empty"><div><div class="big">☰</div><h2>选择一个任务</h2><p>查看任务说明、领取 Part，或处理审核与退修。</p></div></div></div>
</main>

<dialog id="auth-dialog"><div class="dialog-head"><h2 id="auth-title">登录</h2><button class="close" onclick="this.closest('dialog').close()">×</button></div><div class="dialog-body"><div class="form-grid"><div class="field"><label>用户名</label><input id="auth-user" autocomplete="username"></div><div class="field"><label>显示名（仅首次初始化）</label><input id="auth-display"></div><div class="field span2"><label>密码</label><input id="auth-password" type="password" autocomplete="current-password"></div></div><div id="auth-error" class="error"></div></div><div class="dialog-foot"><button class="ghost" onclick="this.closest('dialog').close()">取消</button><button class="primary" onclick="submitAuth()">确认</button></div></dialog>

<dialog id="publish-dialog"><div class="dialog-head"><h2>从任务表格发布</h2><button class="close" onclick="this.closest('dialog').close()">×</button></div><div class="dialog-body"><div class="hint">可直接从 Excel/WPS 复制一行或多行；带表头也能识别。多行会发布为多个独立任务，并使用相同的产品标签和 Part 设置。</div><div class="form-grid"><div class="field"><label>产品大标签 *</label><input id="pub-tag" placeholder="例如 BSD"></div><div class="field"><label>Part 前缀</label><input id="pub-prefix" placeholder="例如 BSD_，结果为 BSD_part_001"></div><div class="field"><label>每个任务的 Part 数量 *</label><input id="pub-count" type="number" min="1" max="10000" value="10"></div><div></div><div class="field span2"><label>粘贴表格行 *</label><textarea id="pub-table" placeholder="申请日期&#9;申请人&#9;项目&#9;标注内容&#9;数据集溯源&#9;每小时可标&#9;数据量&#9;预计工时/单人&#9;数据路径&#9;标注说明书路径"></textarea></div></div><div id="pub-preview" class="hint hidden"></div><div id="pub-error" class="error"></div></div><div class="dialog-foot"><button class="ghost" onclick="previewPublish()">识别预览</button><button class="primary" onclick="publishTasks()">确认发布</button></div></dialog>

<dialog id="edit-dialog"><div class="dialog-head"><h2>编辑任务信息</h2><button class="close" onclick="this.closest('dialog').close()">×</button></div><div class="dialog-body"><div class="hint">修改 Part 前缀只影响之后追加的 Part，已有 Part 名称不会改变。</div><div id="edit-fields" class="form-grid"></div><div id="edit-error" class="error"></div></div><div class="dialog-foot"><button class="ghost" onclick="this.closest('dialog').close()">取消</button><button class="primary" onclick="saveTaskEdit()">保存修改</button></div></dialog>

<dialog id="users-dialog"><div class="dialog-head"><h2>用户管理</h2><button class="close" onclick="this.closest('dialog').close()">×</button></div><div class="dialog-body"><div class="form-grid"><div class="field"><label>用户名</label><input id="new-user"></div><div class="field"><label>显示名</label><input id="new-display"></div><div class="field"><label>初始密码</label><input id="new-password" type="password"></div><div class="field"><label>角色</label><select id="new-role"><option value="user">普通用户</option><option value="admin">管理员</option></select></div></div><div style="margin:12px 0"><button class="primary" onclick="createUser()">创建用户</button></div><div id="users-table" class="table-wrap"></div><div id="users-error" class="error"></div></div></dialog>

<script>
let me=null,bootstrap=false,tasks=[],selected=null,product='全部';
const statusName={pending:'待领取',in_progress:'进行中',submitted:'待审核',rework:'需修改',completed:'已通过'};
const headers=['申请日期','申请人','项目','标注内容','数据集溯源','每小时可标','数据量','预计工时/单人','数据路径','标注说明书路径'];
const fields=['application_date','applicant','project','annotation_content','dataset_source','hourly_capacity','data_amount','estimated_hours','data_path','guide_path'];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(method,url,body){const r=await fetch(url,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin'});let p={};try{p=await r.json()}catch{}if(!r.ok)throw new Error(p.detail||`${r.status} ${r.statusText}`);return p}
function fmtTime(sec){sec=Math.max(0,Math.round(Number(sec)||0));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function copyText(v){navigator.clipboard.writeText(v).then(()=>toast('路径已复制')).catch(()=>prompt('请复制',v))}
function toast(v){const e=document.createElement('div');e.textContent=v;e.style='position:fixed;right:24px;bottom:24px;background:#172033;color:white;padding:10px 15px;border-radius:10px;z-index:99';document.body.append(e);setTimeout(()=>e.remove(),1800)}
async function init(){const a=await api('GET','/api/auth/me');me=a.user;bootstrap=a.bootstrap_required;updateUser();if(me)await loadTasks();else openAuth()}
function updateUser(){document.getElementById('user-name').textContent=me?(me.display_name||me.username):'未登录';document.getElementById('avatar').textContent=me?(me.display_name||me.username).slice(0,1).toUpperCase():'?';document.getElementById('auth-btn').textContent=me?'退出':'登录';document.getElementById('users-btn').classList.toggle('hidden',!(me&&me.role==='admin'))}
function authAction(){if(me){api('POST','/api/auth/logout').then(()=>location.reload())}else openAuth()}
function openAuth(){document.getElementById('auth-title').textContent=bootstrap?'初始化管理员':'登录平台';document.getElementById('auth-display').closest('.field').classList.toggle('hidden',!bootstrap);document.getElementById('auth-error').textContent='';document.getElementById('auth-dialog').showModal()}
async function submitAuth(){const body={username:document.getElementById('auth-user').value.trim(),password:document.getElementById('auth-password').value,display_name:document.getElementById('auth-display').value.trim()};try{const p=await api('POST',bootstrap?'/api/auth/bootstrap-admin':'/api/auth/login',body);me=p.user;bootstrap=false;updateUser();document.getElementById('auth-dialog').close();await loadTasks()}catch(e){document.getElementById('auth-error').textContent=e.message}}
async function loadTasks(){const p=await api('GET','/api/tasks');tasks=p.tasks;renderFilters();renderTasks();if(selected){const exists=tasks.some(t=>t.task_id===selected.task_id);if(exists)await openTask(selected.task_id);else selected=null}}
function setProduct(value){product=value;renderFilters();renderTasks()}
function renderFilters(){const tags=['全部',...new Set(tasks.map(t=>t.product_tag).filter(Boolean))];if(!tags.includes(product))product='全部';document.getElementById('filters').innerHTML=tags.map(t=>`<button class="chip ${t===product?'active':''}" data-product="${esc(t)}" onclick="setProduct(this.dataset.product)">${esc(t)}</button>`).join('')}
function renderTasks(){const q=document.getElementById('search').value.trim().toLowerCase();const list=tasks.filter(t=>(product==='全部'||t.product_tag===product)&&(!q||[t.project,t.annotation_content,t.applicant,t.product_tag].join(' ').toLowerCase().includes(q)));document.getElementById('task-list').innerHTML=list.map(t=>{const s=t.part_summary,rate=s.total?Math.round(s.completed/s.total*100):0;const marker=t.is_publisher?'我发布':(t.my_rework?'有退修':(t.can_review&&s.submitted?`${s.submitted} 个待审核`:''));return `<div class="task-card ${selected&&selected.task_id===t.task_id?'active':''}" onclick="openTask('${t.task_id}')"><div class="task-top"><span class="tag">${esc(t.product_tag||'未分类')}</span><span class="sub">${marker}</span></div><div class="task-name">${esc(t.project||t.name)}</div><div class="sub">${esc(t.annotation_content)} · ${esc(t.applicant||'未知申请人')}</div><div class="progress"><i style="width:${rate}%"></i></div><div class="sub" style="margin-top:5px">${s.completed}/${s.total} 已通过 · ${s.pending} 待领取</div></div>`}).join('')||'<div class="empty" style="min-height:240px">没有匹配的任务</div>'}
async function openTask(id){try{selected=await api('GET',`/api/tasks/${id}`);renderTasks();renderDetail()}catch(e){toast(e.message)}}
function metric(n,label){return `<div class="metric"><b>${n}</b><span>${label}</span></div>`}
function info(label,value,wide=false,copy=false){return `<div class="info ${wide?'wide':''}"><label>${esc(label)}${copy&&value?`<button class="copy" data-copy="${esc(value)}" onclick="copyText(this.dataset.copy)">复制</button>`:''}</label><div class="value">${esc(value||'-')}</div></div>`}
function comments(p){if(!p.comments?.length)return '';return `<div class="comments">${p.comments.map(c=>`<div class="comment"><b>${esc(c.actor)}</b> · ${esc(c.kind)} · ${esc(c.created_at)}<br>${esc(c.content)}</div>`).join('')}</div>`}
function partCard(p,publisher=false){const actions=[];const mine=p.annotator===me?.username;if(mine&&p.status==='in_progress')actions.push(`<button class="compact" onclick="submitPart(${p.part_id})">提交完成</button>`,`<button class="compact" onclick="notePart(${p.part_id})">写备注</button>`);if(mine&&p.status==='rework')actions.push(`<button class="compact rework" onclick="startRework(${p.part_id})">开始修改并计时</button>`,`<button class="compact" onclick="notePart(${p.part_id})">写备注</button>`);if(mine&&['submitted','completed'].includes(p.status))actions.push(`<button class="compact" onclick="notePart(${p.part_id})">补充备注</button>`);if(publisher&&p.status==='submitted')actions.push(`<button class="compact approve" onclick="reviewPart(${p.part_id},'approve')">同意</button>`,`<button class="compact rework" onclick="reviewPart(${p.part_id},'rework')">要求修改</button>`);return `<div class="part ${publisher&&p.status==='submitted'?'review-queue':''}"><div class="part-head"><b>${esc(p.name)}</b><span class="status ${p.status}">${statusName[p.status]||p.status}</span></div><div class="timer">${fmtTime(p.work_seconds)}</div>${publisher?`<div class="sub">标注者：${esc(p.annotator||'-')}</div>`:''}<div class="note">${p.submission_note?`提交：${esc(p.submission_note)}`:''}${p.review_note?`\n审核：${esc(p.review_note)}`:''}</div>${comments(p)}<div class="part-actions">${actions.join('')}</div></div>`}
function renderDetail(){const t=selected,s=t.part_summary;const claim=`<button class="primary" ${t.available_parts?'':'disabled'} onclick="claimNext()">领取下一个 Part</button>`;document.getElementById('content').innerHTML=`<div class="detail"><div class="hero"><div><span class="tag">${esc(t.product_tag)}</span><h1>${esc(t.project||t.name)}</h1><div class="meta-line"><span>申请人 ${esc(t.applicant||'-')}</span><span>申请日期 ${esc(t.application_date||'-')}</span><span>发布者 ${esc(t.publisher)}</span></div></div><div class="hero-actions">${t.is_publisher?`${claim}<button class="primary" onclick="addParts()">＋ 追加 Part</button><button class="ghost" onclick="openTaskEdit()">编辑任务</button><button class="ghost danger" onclick="deleteTask()">删除任务</button>`:claim}<button class="ghost" onclick="loadTasks()">刷新</button></div></div><div class="summary">${metric(s.pending,'待领取')}${metric(s.in_progress,'进行中')}${metric(s.submitted,'待审核')}${metric(s.rework,'需修改')}${metric(s.completed,'已通过')}</div><section><h2>任务信息</h2><div class="info-grid">${info('标注内容',t.annotation_content,true)}${info('数据集溯源',t.dataset_source)}${info('每小时可标',t.hourly_capacity)}${info('数据量',t.data_amount)}${info('预计工时 / 单人',t.estimated_hours)}${info('Part 前缀',t.part_prefix||'(无)')}${info('数据路径',t.data_path,true,true)}${info('标注说明书路径',t.guide_path,true,true)}</div></section>${t.is_publisher?publisherView(t):(t.can_review?adminReviewView(t):workerView(t))}</div>`}
function workerView(t){return `<section><h2>我的 Part</h2>${t.parts.length?`<div class="part-grid">${t.parts.map(p=>partCard(p)).join('')}</div>`:'<div class="hint">你还没有领取这个任务的 Part。</div>'}</section>`}
function publisherView(t){const stats=t.statistics||[];return `<section><h2>人员综合统计（仅发布者可见）</h2><div class="table-wrap"><table><thead><tr><th>标注者</th><th>领取</th><th>已通过</th><th>待审核</th><th>退修</th><th>进行中</th><th>累计计时</th></tr></thead><tbody>${stats.map(x=>`<tr><td>${esc(x.display_name||x.username)}<div class="sub">${esc(x.username)}</div></td><td>${x.total}</td><td>${x.completed}</td><td>${x.submitted}</td><td>${x.rework}</td><td>${x.in_progress}</td><td>${fmtTime(x.work_seconds)}</td></tr>`).join('')||'<tr><td colspan="7" class="sub">尚无人领取</td></tr>'}</tbody></table></div></section><section><h2>Part 审核与明细</h2><div class="part-grid">${t.parts.map(p=>partCard(p,true)).join('')}</div></section>`}
function adminReviewView(t){return `<section><h2>Part 审核与明细（管理员）</h2><div class="hint">管理员可以审核待审核 Part，但任务编辑、删除、追加 Part 和人员统计仍仅限发布者。</div><div class="part-grid">${t.parts.map(p=>partCard(p,true)).join('')}</div></section>`}
async function claimNext(){try{await api('POST',`/api/tasks/${selected.task_id}/parts/claim-next`);await loadTasks()}catch(e){toast(e.message)}}
async function submitPart(id){const note=prompt('提交备注（可填写特殊情况或问题）','');if(note===null)return;try{await api('POST',`/api/tasks/${selected.task_id}/parts/${id}/submit`,{note});await loadTasks()}catch(e){toast(e.message)}}
async function notePart(id){const content=prompt('补充备注','');if(!content)return;try{await api('POST',`/api/tasks/${selected.task_id}/parts/${id}/comments`,{content});await loadTasks()}catch(e){toast(e.message)}}
async function startRework(id){try{await api('POST',`/api/tasks/${selected.task_id}/parts/${id}/start-rework`);await loadTasks()}catch(e){toast(e.message)}}
async function reviewPart(id,action){const note=prompt(action==='approve'?'同意意见（可选）':'请填写修改意见',action==='approve'?'检查通过':'');if(note===null||action==='rework'&&!note.trim())return;try{await api('POST',`/api/tasks/${selected.task_id}/parts/${id}/review`,{action,note});await loadTasks()}catch(e){toast(e.message)}}
async function addParts(){const count=parseInt(prompt('继续增加多少个 Part？','10'),10);if(!count)return;try{await api('POST',`/api/tasks/${selected.task_id}/parts`,{count});await loadTasks()}catch(e){toast(e.message)}}
function openTaskEdit(){const values=[['product_tag','产品大标签 *'],['part_prefix','Part 前缀'],...fields.map((f,i)=>[f,headers[i]])];document.getElementById('edit-fields').innerHTML=values.map(([field,label])=>`<div class="field ${['annotation_content','data_path','guide_path'].includes(field)?'span2':''}"><label>${esc(label)}</label><input id="edit-${field}" value="${esc(selected[field]||'')}"></div>`).join('');document.getElementById('edit-error').textContent='';document.getElementById('edit-dialog').showModal()}
async function saveTaskEdit(){const body={product_tag:document.getElementById('edit-product_tag').value.trim(),part_prefix:document.getElementById('edit-part_prefix').value.trim()};fields.forEach(f=>body[f]=document.getElementById(`edit-${f}`).value.trim());try{await api('PATCH',`/api/tasks/${selected.task_id}`,body);document.getElementById('edit-dialog').close();toast('任务信息已更新');await loadTasks()}catch(e){document.getElementById('edit-error').textContent=e.message}}
async function deleteTask(){if(!confirm(`确定删除任务“${selected.project||selected.name}”吗？\n\n无论当前完成状态如何，删除后都不会再显示。`))return;try{await api('DELETE',`/api/tasks/${selected.task_id}`);selected=null;await loadTasks();document.getElementById('content').innerHTML='<div class="empty"><div><div class="big">✓</div><h2>任务已删除</h2><p>请选择其他任务继续操作。</p></div></div>';toast('任务已删除')}catch(e){toast(e.message)}}
function openPublish(){if(!me){openAuth();return}document.getElementById('pub-error').textContent='';document.getElementById('pub-preview').classList.add('hidden');document.getElementById('publish-dialog').showModal()}
function publishBody(){return{clipboard_text:document.getElementById('pub-table').value,product_tag:document.getElementById('pub-tag').value.trim(),part_count:parseInt(document.getElementById('pub-count').value,10)||0,part_prefix:document.getElementById('pub-prefix').value.trim()}}
async function previewPublish(){try{const p=await api('POST','/api/tasks/preview',publishBody());const e=document.getElementById('pub-preview');e.innerHTML=`识别到 <b>${p.count}</b> 个任务：`+p.rows.map(r=>`<div>${esc(r.project)} · ${esc(r.annotation_content)}</div>`).join('');e.classList.remove('hidden');document.getElementById('pub-error').textContent=''}catch(e){document.getElementById('pub-error').textContent=e.message}}
async function publishTasks(){try{const p=await api('POST','/api/tasks',publishBody());document.getElementById('publish-dialog').close();toast(`已发布 ${p.count} 个任务`);await loadTasks();if(p.tasks.length)await openTask(p.tasks[0].task_id)}catch(e){document.getElementById('pub-error').textContent=e.message}}
async function openUsers(){document.getElementById('users-dialog').showModal();await loadUsers()}
async function loadUsers(){try{const p=await api('GET','/api/users');document.getElementById('users-table').innerHTML=`<table><thead><tr><th>用户名</th><th>显示名</th><th>角色</th><th>状态</th></tr></thead><tbody>${p.users.map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.display_name)}</td><td>${esc(u.role)}</td><td>${u.is_active?'启用':'停用'}</td></tr>`).join('')}</tbody></table>`}catch(e){document.getElementById('users-error').textContent=e.message}}
async function createUser(){try{await api('POST','/api/users',{username:document.getElementById('new-user').value.trim(),display_name:document.getElementById('new-display').value.trim(),password:document.getElementById('new-password').value,role:document.getElementById('new-role').value});await loadUsers();toast('用户已创建')}catch(e){document.getElementById('users-error').textContent=e.message}}
setInterval(()=>{if(me&&selected)openTask(selected.task_id)},15000);init().catch(e=>toast(e.message));
</script>
</body>
</html>
