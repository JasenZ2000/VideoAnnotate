[project]
name = "video-annotation-workflow"
version = "0.5.0"
description = "Team video annotation workflow with GPU-assisted prelabeling and tracking"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "pydantic>=2.7",
    "paramiko>=3.4",
    "python-multipart>=0.0.9",
]

[project.scripts]
annotation-platform = "workflow_platform.server:main"
local-workbench = "local_workbench.server:main"
gpu-services = "gpu_services.server:main"
locany-batch-tool = "locany_batch_tool.gui:main"
dataset-split-tool = "dataset_split_tool.gui:main"
part-directory-scanner = "workflow_platform.part_scanner_gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils", "workflow_platform", "gpu_services", "local_workbench", "locany_batch_tool", "dataset_split_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
