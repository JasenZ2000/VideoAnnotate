[project]
name = "video-annotator"
version = "0.2.0"
description = "Minimal video annotation tool for object tracking"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "opencv-python>=4.8",
    "numpy>=1.24",
]

[project.scripts]
annotator = "annotator.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["annotator"]
