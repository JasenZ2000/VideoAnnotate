[project]
name = "video-annotation-workflow"
version = "0.5.0"
description = "Team video annotation workflow with GPU-assisted prelabeling and tracking"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "pydantic>=2.7",
    "paramiko>=3.4",
    "python-multipart>=0.0.9",
]

[project.scripts]
annotator = "annotator.server:main"
annotation-platform = "workflow_platform.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["annotator", "workflow_platform", "mot_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
